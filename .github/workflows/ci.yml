name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,proxy-intercept]"

      - name: Ruff
        run: ruff check torbrowser_driver torbrowser_mcp tests

      - name: Mypy
        run: mypy

      - name: Pytest (unit tests only)
        run: pytest tests/ -q --tb=short -m "not integration"
