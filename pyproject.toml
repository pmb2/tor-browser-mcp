[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torbrowser-mcp"
version = "0.0.0"
description = "MCP server for stock Tor Browser automation via geckodriver and Marionette"
readme = "README.md"
license = "MIT"
authors = [{ name = "Botond Ormandi" }]
requires-python = ">=3.10"
keywords = ["tor", "tor-browser", "mcp", "browser-automation", "geckodriver", "marionette"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "selenium>=4.15",
    "stem>=1.8",
    "mcp>=1.0,<2",
    "urllib3[socks]>=2",
]

[project.scripts]
torbrowser-mcp = "torbrowser_mcp.cli:main"

[project.urls]
Repository = "https://github.com/Boti-Ormandi/tor-browser-mcp"
Issues = "https://github.com/Boti-Ormandi/tor-browser-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
proxy-intercept = [
    "mitmproxy>=11,<13",
    "python-socks>=2,<3",
]

[tool.setuptools.packages.find]
include = ["torbrowser_driver*", "torbrowser_mcp*"]
exclude = ["tests*", "references*"]

[tool.setuptools.package-data]
"torbrowser_driver" = [
    "py.typed",
    "_helper_extension/manifest.json",
    "_helper_extension/background.js",
    "_helper_extension/background.html",
]
"torbrowser_mcp" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a real Tor Browser binary; opt-in",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
