[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "torbrowser-mcp"
version = "0.1.0"
description = "MCP server for stock Tor Browser automation via geckodriver and Marionette"
readme = "README.md"
license = "MIT"
authors = [{ name = "Botond Ormandi" }]
requires-python = ">=3.11"
keywords = ["tor", "tor-browser", "mcp", "browser-automation", "geckodriver", "marionette"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "selenium>=4.15",
    "stem>=1.8",
    "mcp>=1.0,<2",
    "urllib3[socks]>=2",
]

[project.scripts]
torbrowser-mcp = "torbrowser_mcp.cli:main"

[project.urls]
Repository = "https://github.com/Boti-Ormandi/tor-browser-mcp"
Issues = "https://github.com/Boti-Ormandi/tor-browser-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.6",
    "mypy>=1.10",
]
proxy-intercept = [
    "mitmproxy>=11,<13",
    "python-socks>=2,<3",
]

[tool.setuptools.packages.find]
include = ["torbrowser_driver*", "torbrowser_mcp*"]
exclude = ["tests*", "references*"]

[tool.setuptools.package-data]
"torbrowser_driver" = [
    "py.typed",
    "_helper_extension/manifest.json",
    "_helper_extension/background.js",
    "_helper_extension/background.html",
]
"torbrowser_mcp" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
strict_markers = true
markers = [
    "integration: requires a real Tor Browser binary; opt-in",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "SIM",
    "UP",
    "RUF",
    "RET",
    "PT",
    "TCH",
]
ignore = [
    # try/except/pass to contextlib.suppress; mechanical conversion that adds
    # an indent level and an import for no behaviour change.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    # Tests routinely raise on broad exception types and check the message
    # separately; that pattern is intentional and pre-dates this config.
    "PT011",
    # Composite assertions are common in tests and easier to read than the
    # split form pytest-style would prefer.
    "PT018",
    # Tests import application classes at module scope for readability; the
    # TYPE_CHECKING migration is only enforced on the library packages.
    "TC001",
    "TC002",
    "TC003",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# torbrowser_mcp has a narrow surface with explicit types and runs under
# strict mypy. torbrowser_driver wraps selenium where the upstream stubs are
# weak; full strict mode produces dozens of false positives, so the broad
# package runs in a partial-strict profile that catches the audit findings
# most likely to recur: unused type-ignore comments and redundant casts.
# python_version is set to 3.12 (above the project's 3.11 minimum) so mypy
# parses third-party packages that use PEP 695 type statements; the language
# features used in this codebase target 3.11 regardless.
follow_imports = "silent"
files = ["torbrowser_mcp", "torbrowser_driver"]
warn_unused_ignores = true
warn_redundant_casts = true
# Default-mypy errors against selenium-wrapping code stem from weak upstream
# stubs (untyped generics, Any return types, module-attribute shadowing).
# Disable those whole categories rather than litter the code with
# type:ignore comments that themselves fail warn_unused_ignores.
disable_error_code = [
    "type-arg",
    "no-untyped-call",
    "no-any-return",
    "name-defined",
    "assignment",
    "arg-type",
]

[[tool.mypy.overrides]]
module = "torbrowser_mcp.*"
strict = true
# torbrowser_mcp is the strict-mode scope; re-enable the categories disabled
# globally so the small typed package still benefits from full strict.
disable_error_code = []
